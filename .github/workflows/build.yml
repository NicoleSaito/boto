name: Build & Test

on:
name: Build

on:
  push:
    branches: [ main, hom, dev ]
  pull_request:
    branches: [ main, hom, dev ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
  push:
    branches: [ main, hom, dev ]
  pull_request:
    branches: [ main, hom, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Rodar testes com cobertura
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Publicar relatório de cobertura
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Checar vulnerabilidades em pacotes NuGet
        run: dotnet list package --vulnerable --include-transitive

      - name: Verificar formatação do código
        run: dotnet format --verify-no-changes --verbosity diagnostic

      